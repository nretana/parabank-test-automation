name: Playwright Tests
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Run Playwright Tests
        run: npm run test:@regression

      - name: Save the report as artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: parabank-test-report
          path: src/reports/regression/
          retention-days: 10

  deploy-test-report:
    needs: test 
    if: always()
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Download the test report
        uses: actions/download-artifact@v4
        with:
          name: parabank-test-report
          path: parabank-test-report

      - name: Deploy test report to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PARABANK }}
          action: "upload"
          app_location: "parabank-test-report"
          skip_app_build: true
          output_location: ""
